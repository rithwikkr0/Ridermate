apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ridermate-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - ridermate.com
    - www.ridermate.com
    secretName: ridermate-tls
  rules:
  - host: ridermate.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ridermate-service
            port:
              number: 80
  - host: www.ridermate.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ridermate-service
            port:
              number: 80
