apiVersion: apps/v1
kind: Deployment
metadata:
  name: ridermate-web
  labels:
    app: ridermate
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ridermate
      tier: frontend
  template:
    metadata:
      labels:
        app: ridermate
        tier: frontend
    spec:
      containers:
      - name: web
        image: ghcr.io/rithwikkr0/ridermate:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_VERSION
          value: "1.0.0"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      terminationGracePeriodSeconds: 30
